encryptionMethod=function aes256($data,$mode){$result="";$blocksize=16;$key=base64_decode("{aes256Key}");$iv=base64_decode("{aes256IV}");if($mode==1){$pad=$blocksize -(strlen($data)% $blocksize);$data .=str_repeat(chr($pad), $pad);}if(function_exists("openssl_encrypt")){if($mode==1){$result=openssl_encrypt($data,"AES-256-CBC",$key,OPENSSL_RAW_DATA|OPENSSL_ZERO_PADDING,$iv);}else{$result=openssl_decrypt($data,"AES-256-CBC",$key,OPENSSL_RAW_DATA|OPENSSL_ZERO_PADDING,$iv);}}else if(function_exists("mcrypt_encrypt")){if($mode==1){$result=mcrypt_encrypt("rijndael-128", $key, $data, "cbc", $iv);}else{$result=mcrypt_decrypt("rijndael-128", $key, $data, "cbc", $iv);}}if($mode==2){$pad=ord($result{strlen($result)-1});if($pad > strlen($result))return false;if(strspn($result, chr($pad), strlen($result)- $pad)!=$pad)return false;$result=substr($result, 0, -1 * $pad);}return $result;}
variable=
