encryptionMethod=public static byte[] toHex(byte[] bytes){int l = bytes.length;byte[] out = new byte[l * 2];int j = 0;for (int i = 0; i < l; i++) {byte b = bytes[i];out[j++] = (byte) Character.forDigit((b >> 4) & 0xF, 16);out[j++] = (byte) Character.forDigit((b & 0xF), 16);}return out;}
decryptionMethod=public static byte[] unHex(byte[] data){int len = data.length;byte[] out = new byte[len / 2];for (int i = 0, j = 0; j < len; i++) {int f =  Character.digit(data[j++], 16) << 4;f |= Character.digit(data[j++], 16);out[i] = (byte)(f & 0xFF);}return out;}
