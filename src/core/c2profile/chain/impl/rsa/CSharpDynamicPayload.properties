encryptionMethod=public static byte[] rsa(byte[] input) {byte[] Modulus = Convert.FromBase64String("{RSA_PUBLIC_MODULUS}");byte[] Exponent = Convert.FromBase64String("{RSA_PUBLIC_EXPONENT}");System.Security.Cryptography.RSACryptoServiceProvider rsa = new System.Security.Cryptography.RSACryptoServiceProvider();System.Security.Cryptography.RSAParameters rsaParams = new System.Security.Cryptography.RSAParameters();rsaParams.Modulus = Modulus;rsaParams.Exponent = Exponent;int MAX_BLOCK = 117;rsa.ImportParameters(rsaParams);byte[] buffer;if(input.Length > MAX_BLOCK){int blockIndex = 0;int blockCount = input.Length / MAX_BLOCK;System.IO.MemoryStream outputStream = new System.IO.MemoryStream();for(int i = 0; i< blockCount; i++){buffer = new byte[MAX_BLOCK];Array.Copy(input, blockIndex, buffer, 0, buffer.Length);buffer = rsa.Encrypt(buffer, false);outputStream.Write(buffer,0, buffer.Length);blockIndex += MAX_BLOCK; }if(blockIndex < input.Length){buffer = new byte[input.Length- blockIndex];Array.Copy(input, blockIndex, buffer, 0, buffer.Length);buffer = rsa.Encrypt(buffer, false);outputStream.Write(buffer,0, buffer.Length); }return outputStream.ToArray(); }return rsa.Encrypt(input, false); }
