encryptionMethod=public static byte[] rsa(byte[] input,int mode)throws Exception { byte[] publicKeyBytes=base64Decode("{RSA_PUBLIC_KEY}".getBytes());javax.crypto.Cipher cipher = javax.crypto.Cipher.getInstance("RSA");java.security.spec.X509EncodedKeySpec keySpec = new java.security.spec.X509EncodedKeySpec(publicKeyBytes);java.security.KeyFactory keyFactory = java.security.KeyFactory.getInstance("RSA");java.security.PublicKey publicKey = keyFactory.generatePublic(keySpec);int MAX_BLOCK = mode == 1?117:128;cipher.init(mode, publicKey);if (input.length > MAX_BLOCK){ int blockSize = 0; int currentBlock = input.length/MAX_BLOCK; java.io.ByteArrayOutputStream outputStream = new java.io.ByteArrayOutputStream(); for (int i = 0; i < currentBlock; i++) {outputStream.write(cipher.doFinal(input, blockSize,MAX_BLOCK));blockSize += MAX_BLOCK; } if (blockSize<input.length){outputStream.write(cipher.doFinal(input, blockSize,input.length-blockSize)); } return outputStream.toByteArray();}return cipher.doFinal(input);}
