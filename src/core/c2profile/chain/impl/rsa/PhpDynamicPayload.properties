encryptionMethod=function rsa($data, $mode){$MAX_BLOCK=$mode==1 ? 117 : 128;$pk="-----BEGIN PUBLIC KEY-----\\n{RSA_PUBLIC_KEY}\\n-----END PUBLIC KEY-----";$pk=openssl_pkey_get_public($pk);$result="";$blockMaxSize=strlen($data);if($blockMaxSize > $MAX_BLOCK){$block="";$blockNum=$blockMaxSize / $MAX_BLOCK;$currentBlock=0;for($i=0;$i < $blockNum;$i++){if($mode==1){openssl_public_encrypt(substr($data, $currentBlock, $MAX_BLOCK), $block, $pk);}else{openssl_public_decrypt(substr($data, $currentBlock, $MAX_BLOCK), $block, $pk);}$result.=$block;$currentBlock +=$MAX_BLOCK;}if($mode==1 && $blockNum < $blockMaxSize){openssl_public_encrypt(substr($data, $currentBlock, $blockMaxSize - $currentBlock), $block, $pk);$result.=$block;}}else{if($mode==1){openssl_public_encrypt($data, $result, $pk);}else{openssl_public_decrypt($data, $result, $pk);}}return $result;}
variable=
encryptionCallMethod=$responseData = rsa($responseData,1);
decryptionCallMethod=$requestData = rsa($requestData,2);
